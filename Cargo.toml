[package]
name = "oaopenweather"
version = "0.1.0"
edition = "2024"
description = "OpenDeck/Stream Deck plugin showing current weather on a key (WeatherAPI / OpenWeatherMap)"
license = "MIT"
authors = ["Garrett Faucher <garrettfaucher@gmail.com>"]
repository = "https://github.com/garrettfaucher/streamdeck-openweather"
homepage = "https://github.com/garrettfaucher/streamdeck-openweather"
readme = "README.md"
keywords = ["streamdeck", "opendeck", "openaction", "plugin"]
categories = ["hardware-support"]

[dependencies]
openaction  = "2.6"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1"
async-trait = "0.1"
base64      = "0.22"
log         = "0.4"
simplelog   = "0.12"
anyhow      = "1"
dashmap     = "6"
